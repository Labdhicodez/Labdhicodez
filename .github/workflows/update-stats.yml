name: Update profile stats

on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC (off the hour to avoid peak load)
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'scripts/**'           # re-generate when the generator or theme changes

# Least privilege: the job only needs to push regenerated files.
permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build banner and illustration
        run: node scripts/build-art.mjs --name "Labdhi Belani"

      - name: Generate graphics from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built in, nothing to create
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit only if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
